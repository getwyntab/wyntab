name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate DESIGN.md spec
        run: npm run design:lint

      - name: Type check
        run: npm run compile

      - name: Run unit & UI tests
        run: npm test

      - name: Build Chrome MV3
        run: npm run build

      - name: Build Firefox MV2
        run: npm run build:firefox
