<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>New Tab</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body, #root {
        margin: 0;
        padding: 0;
        background-color: #090909;
        min-height: 100dvh;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
      }

      /* Top accent beam */
      #loader-bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent 0%, #38bdf8 50%, transparent 100%);
        background-size: 200% 100%;
        animation: loader-slide 1.2s infinite ease-in-out;
        z-index: 50;
        pointer-events: none;
        transition: opacity 300ms ease-out;
      }

      @keyframes loader-slide {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }

      /* Ambient generating pulse in center */
      #loader-ambient {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        z-index: 40;
        pointer-events: none;
        transition: opacity 350ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      .ambient-orb {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(56, 189, 248, 0.22) 0%, rgba(56, 189, 248, 0.04) 55%, transparent 70%);
        border: 1px solid rgba(56, 189, 248, 0.25);
        animation: ambient-breathe 1.5s infinite ease-in-out;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .ambient-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #38bdf8;
        box-shadow: 0 0 10px rgba(56, 189, 248, 0.85);
        animation: dot-pulse 1.5s infinite ease-in-out;
      }

      @keyframes ambient-breathe {
        0%, 100% { transform: scale(0.92); opacity: 0.35; border-color: rgba(56, 189, 248, 0.15); }
        50% { transform: scale(1.08); opacity: 0.85; border-color: rgba(56, 189, 248, 0.35); }
      }

      @keyframes dot-pulse {
        0%, 100% { transform: scale(0.85); opacity: 0.55; }
        50% { transform: scale(1.15); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="loader-bar"></div>
    <div id="loader-ambient">
      <div class="ambient-orb">
        <div class="ambient-dot"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
