<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time - WYNTab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #07090e;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body class="bg-[#07090e] text-slate-100 min-h-screen flex flex-col justify-between selection:bg-slate-700 selection:text-white">
  <div id="root">
    <!-- Static fallback for dashboard thumbnail -->
    <div class="min-h-screen flex flex-col items-center justify-center p-6 text-center">
      <div class="p-8 rounded-3xl bg-slate-900/60 border border-slate-800 flex flex-col items-center gap-4 max-w-md w-full">
        <span class="text-xs font-mono uppercase tracking-widest text-emerald-400">Live Clock</span>
        <div class="text-7xl font-extrabold tracking-tight text-white font-mono">12:00</div>
        <div class="text-sm text-slate-400">Saturday, October 24</div>
      </div>
    </div>
  </div>

  <script type="text/babel" data-type="module" data-presets="react">
    import React, { useState, useEffect } from 'react'
    import { createRoot } from 'react-dom/client'
    import { Clock, Timer, Play, Pause, RotateCcw, Globe } from 'lucide-react'

    function TimeApp() {
      const [activeTab, setActiveTab] = useState('clock')
      const [now, setNow] = useState(new Date())
      const [is12h, setIs12h] = useState(false)

      // Stopwatch state
      const [swRunning, setSwRunning] = useState(false)
      const [swElapsed, setSwElapsed] = useState(0)

      // Clock loop
      useEffect(() => {
        const timer = setInterval(() => setNow(new Date()), 100)
        return () => clearInterval(timer)
      }, [])

      // Stopwatch loop
      useEffect(() => {
        let interval = null
        if (swRunning) {
          const start = Date.now() - swElapsed
          interval = setInterval(() => {
            setSwElapsed(Date.now() - start)
          }, 20)
        }
        return () => clearInterval(interval)
      }, [swRunning])

      // Load format preference
      useEffect(() => {
        if (window.wyntab) {
          window.wyntab.get('time_is12h').then(val => {
            if (typeof val === 'boolean') setIs12h(val)
          })
        }
      }, [])

      const toggleFormat = () => {
        const next = !is12h
        setIs12h(next)
        if (window.wyntab) window.wyntab.set('time_is12h', next)
      }

      // Format local time
      let hours = now.getHours()
      const ampm = hours >= 12 ? 'PM' : 'AM'
      if (is12h) hours = hours % 12 || 12
      const timeStr = `${String(hours).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`
      const secondsStr = String(now.getSeconds()).padStart(2, '0')
      const dateStr = now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })

      // World clock helpers
      const getZoneTime = (timeZone) => {
        try {
          return new Intl.DateTimeFormat([], {
            timeZone,
            hour: '2-digit',
            minute: '2-digit',
            hour12: is12h
          }).format(now)
        } catch {
          return '--:--'
        }
      }

      // Format stopwatch display
      const swMinutes = String(Math.floor(swElapsed / 60000)).padStart(2, '0')
      const swSeconds = String(Math.floor((swElapsed % 60000) / 1000)).padStart(2, '0')
      const swHundredths = String(Math.floor((swElapsed % 1000) / 10)).padStart(2, '0')

      // Progress through current minute
      const secProgress = ((now.getSeconds() + now.getMilliseconds() / 1000) / 60) * 100

      return (
        <div className="min-h-screen flex flex-col justify-between p-8 sm:p-12 max-w-4xl mx-auto w-full">
          {/* Header & Tabs */}
          <header className="flex items-center justify-between">
            <div className="flex items-center gap-1 p-1 bg-slate-900 border border-slate-800 rounded-xl text-xs font-medium">
              <button
                type="button"
                onClick={() => setActiveTab('clock')}
                className={`flex items-center gap-2 px-3 py-1.5 rounded-lg transition-colors ${
                  activeTab === 'clock' ? 'bg-slate-800 text-white shadow-xs' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <Clock className="w-3.5 h-3.5" />
                <span>Clock</span>
              </button>
              <button
                type="button"
                onClick={() => setActiveTab('timer')}
                className={`flex items-center gap-2 px-3 py-1.5 rounded-lg transition-colors ${
                  activeTab === 'timer' ? 'bg-slate-800 text-white shadow-xs' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <Timer className="w-3.5 h-3.5" />
                <span>Stopwatch</span>
              </button>
            </div>

            {activeTab === 'clock' && (
              <button
                type="button"
                onClick={toggleFormat}
                className="text-xs font-mono px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 transition-colors"
              >
                {is12h ? '12-Hour' : '24-Hour'}
              </button>
            )}
          </header>

          {/* Main Card */}
          <main className="my-auto flex flex-col items-center text-center py-12">
            {activeTab === 'clock' ? (
              <div className="flex flex-col items-center">
                {/* Big Clock Display */}
                <div className="flex items-baseline gap-2 font-mono tabular-nums mb-3">
                  <span className="text-7xl sm:text-8xl md:text-9xl font-extrabold tracking-tighter text-white">
                    {timeStr}
                  </span>
                  <div className="flex flex-col items-start gap-1">
                    <span className="text-2xl sm:text-3xl font-bold text-sky-400">
                      {secondsStr}
                    </span>
                    {is12h && (
                      <span className="text-xs font-bold uppercase tracking-wider text-slate-500">
                        {ampm}
                      </span>
                    )}
                  </div>
                </div>

                <div className="text-sm sm:text-base text-slate-400 font-medium mb-12">
                  {dateStr}
                </div>

                {/* World Clock Cards */}
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 w-full max-w-2xl">
                  {[
                    { label: 'UTC', zone: 'UTC' },
                    { label: 'New York', zone: 'America/New_York' },
                    { label: 'London', zone: 'Europe/London' },
                    { label: 'Tokyo', zone: 'Asia/Tokyo' },
                  ].map(item => (
                    <div key={item.label} className="p-3.5 rounded-xl bg-slate-900/60 border border-slate-800/80 flex flex-col items-center gap-1 backdrop-blur-sm">
                      <div className="flex items-center gap-1.5 text-[11px] font-mono text-slate-500">
                        <Globe className="w-3 h-3 text-slate-400" />
                        <span>{item.label}</span>
                      </div>
                      <div className="text-base font-bold font-mono text-slate-200">
                        {getZoneTime(item.zone)}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            ) : (
              <div className="flex flex-col items-center">
                {/* Stopwatch Display */}
                <div className="text-6xl sm:text-8xl md:text-9xl font-extrabold font-mono tabular-nums text-white mb-8 tracking-tighter">
                  <span>{swMinutes}:{swSeconds}</span>
                  <span className="text-3xl sm:text-5xl text-sky-400">.{swHundredths}</span>
                </div>

                {/* Stopwatch Controls */}
                <div className="flex items-center gap-4">
                  <button
                    type="button"
                    onClick={() => setSwRunning(!swRunning)}
                    className={`flex items-center gap-2 px-6 py-3 rounded-xl font-bold text-sm transition-all shadow-lg ${
                      swRunning
                        ? 'bg-amber-600 hover:bg-amber-500 text-white'
                        : 'bg-indigo-600 hover:bg-indigo-500 text-white'
                    }`}
                  >
                    {swRunning ? <Pause className="w-4 h-4 fill-white" /> : <Play className="w-4 h-4 fill-white" />}
                    <span>{swRunning ? 'Pause' : 'Start'}</span>
                  </button>

                  <button
                    type="button"
                    onClick={() => {
                      setSwRunning(false)
                      setSwElapsed(0)
                    }}
                    disabled={swElapsed === 0}
                    className="flex items-center gap-2 px-5 py-3 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 disabled:opacity-40 disabled:pointer-events-none text-sm font-medium transition-colors"
                  >
                    <RotateCcw className="w-4 h-4" />
                    <span>Reset</span>
                  </button>
                </div>
              </div>
            )}
          </main>

          {/* Bottom Seconds Bar */}
          <footer className="w-full">
            <div className="w-full h-1 bg-slate-900 rounded-full overflow-hidden">
              <div
                className="h-full bg-gradient-to-r from-sky-500 to-indigo-500 transition-all duration-100 ease-linear"
                style={{ width: `${secProgress}%` }}
              />
            </div>
          </footer>
        </div>
      )
    }

    createRoot(document.getElementById('root')).render(<TimeApp />)
  </script>
</body>
</html>
