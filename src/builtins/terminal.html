<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal - WYNTab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #07090e;
      color: #38bdf8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body class="bg-[#07090e] min-h-screen flex items-center justify-center p-4 sm:p-8">
  <div id="root" class="w-full max-w-3xl">
    <!-- Static fallback for dashboard thumbnail -->
    <div class="rounded-2xl bg-black/90 border border-slate-800 p-6 font-mono text-sm shadow-2xl">
      <div class="flex items-center gap-2 mb-4 pb-3 border-b border-slate-800 text-slate-500 text-xs">
        <span class="w-3 h-3 rounded-full bg-rose-500/80 inline-block"></span>
        <span class="w-3 h-3 rounded-full bg-amber-500/80 inline-block"></span>
        <span class="w-3 h-3 rounded-full bg-emerald-500/80 inline-block"></span>
        <span class="ml-2 text-slate-400">wyntab — zsh</span>
      </div>
      <div class="text-emerald-400">&gt; session.start — OK</div>
      <div class="text-slate-400 mt-2">Type "help" for a list of available commands.</div>
    </div>
  </div>

  <script type="text/babel" data-type="module" data-presets="react">
    import React, { useState, useEffect, useRef } from 'react'
    import { createRoot } from 'react-dom/client'
    import { Terminal as TerminalIcon } from 'lucide-react'

    const THEMES = {
      default: { text: 'text-slate-100', accent: 'text-sky-400', prompt: 'text-indigo-400', border: 'border-slate-800', bg: 'bg-[#090b10]' },
      green: { text: 'text-emerald-300', accent: 'text-emerald-400', prompt: 'text-emerald-500', border: 'border-emerald-950/60', bg: 'bg-[#050f08]' },
      amber: { text: 'text-amber-200', accent: 'text-amber-400', prompt: 'text-amber-500', border: 'border-amber-950/60', bg: 'bg-[#0f0b05]' },
      cyan: { text: 'text-cyan-200', accent: 'text-cyan-400', prompt: 'text-cyan-500', border: 'border-cyan-950/60', bg: 'bg-[#050d12]' },
    }

    function TerminalApp() {
      const [history, setHistory] = useState([
        { type: 'output', text: 'WYNTab Terminal v0.5.2' },
        { type: 'output', text: 'Type "help" for a list of commands, or "theme <name>" to customize.' },
      ])
      const [inputVal, setInputVal] = useState('')
      const [cmdHistory, setCmdHistory] = useState([])
      const [historyIndex, setHistoryIndex] = useState(-1)
      const [themeKey, setThemeKey] = useState('default')
      const inputRef = useRef(null)
      const bottomRef = useRef(null)

      // Load persisted theme
      useEffect(() => {
        if (window.wyntab) {
          window.wyntab.get('terminal_theme').then(saved => {
            if (saved && THEMES[saved]) setThemeKey(saved)
          })
        }
      }, [])

      // Auto scroll to bottom
      useEffect(() => {
        bottomRef.current?.scrollIntoView({ behavior: 'smooth' })
      }, [history])

      const handleThemeChange = (newTheme) => {
        if (THEMES[newTheme]) {
          setThemeKey(newTheme)
          if (window.wyntab) window.wyntab.set('terminal_theme', newTheme)
          return `Theme switched to "${newTheme}".`
        }
        return `Unknown theme: "${newTheme}". Available: default, green, amber, cyan.`
      }

      const executeCommand = (cmd) => {
        const raw = cmd.trim()
        if (!raw) return

        const args = raw.split(/\s+/)
        const action = args[0].toLowerCase()
        const rest = args.slice(1).join(' ')

        let output = ''

        switch (action) {
          case 'help':
            output = [
              'Available commands:',
              '  help               - Display this help message',
              '  time               - Display current date and time',
              '  search <query>     - Search the web with Google',
              '  open <url>         - Open URL in new tab',
              '  links              - Display quick access bookmarks',
              '  calc <expression>  - Safely evaluate arithmetic expression',
              '  theme <name>       - Switch theme (default, green, amber, cyan)',
              '  clear              - Clear terminal window',
              '  echo <text>        - Print text'
            ].join('\n')
            break

          case 'time':
            output = new Date().toLocaleString()
            break

          case 'search':
            if (!rest) {
              output = 'Usage: search <query>'
            } else {
              output = `Searching for: "${rest}"...`
              window.open(`https://www.google.com/search?q=${encodeURIComponent(rest)}`, '_blank')
            }
            break

          case 'open':
            if (!rest) {
              output = 'Usage: open <url>'
            } else {
              const url = /^https?:\/\//i.test(rest) ? rest : `https://${rest}`
              output = `Opening: ${url}...`
              window.open(url, '_blank')
            }
            break

          case 'links':
            output = [
              'Quick Shortcuts:',
              '  github     -> https://github.com',
              '  mdn        -> https://developer.mozilla.org',
              '  news       -> https://news.ycombinator.com',
              '  reddit     -> https://reddit.com'
            ].join('\n')
            break

          case 'calc':
            if (!rest) {
              output = 'Usage: calc <expression> (e.g. calc 24 * 60)'
            } else {
              try {
                // Safe numeric evaluation
                if (/^[0-9+\-*/().\s%]+$/.test(rest)) {
                  const res = Function(`"use strict"; return (${rest})`)()
                  output = `= ${res}`
                } else {
                  output = 'Error: Invalid arithmetic characters.'
                }
              } catch (err) {
                output = `Error: ${err.message}`
              }
            }
            break

          case 'theme':
            output = handleThemeChange(rest.toLowerCase())
            break

          case 'echo':
            output = rest
            break

          case 'clear':
            setHistory([])
            return

          default:
            output = `command not found: "${action}". Type "help" for assistance.`
            break
        }

        setHistory(prev => [
          ...prev,
          { type: 'command', text: raw },
          ...(output ? [{ type: 'output', text: output }] : [])
        ])
      }

      const handleKeyDown = (e) => {
        if (e.key === 'Enter') {
          const cmd = inputVal
          if (cmd.trim()) {
            setCmdHistory(prev => [...prev, cmd])
            setHistoryIndex(-1)
          }
          executeCommand(cmd)
          setInputVal('')
        } else if (e.key === 'ArrowUp') {
          e.preventDefault()
          if (cmdHistory.length > 0) {
            const nextIdx = historyIndex === -1 ? cmdHistory.length - 1 : Math.max(0, historyIndex - 1)
            setHistoryIndex(nextIdx)
            setInputVal(cmdHistory[nextIdx])
          }
        } else if (e.key === 'ArrowDown') {
          e.preventDefault()
          if (historyIndex !== -1) {
            const nextIdx = historyIndex + 1
            if (nextIdx < cmdHistory.length) {
              setHistoryIndex(nextIdx)
              setInputVal(cmdHistory[nextIdx])
            } else {
              setHistoryIndex(-1)
              setInputVal('')
            }
          }
        }
      }

      const currentTheme = THEMES[themeKey] || THEMES.default

      return (
        <div
          onClick={() => inputRef.current?.focus()}
          className={`w-full max-w-4xl mx-auto rounded-2xl ${currentTheme.bg} border ${currentTheme.border} shadow-2xl overflow-hidden flex flex-col font-mono text-xs sm:text-sm min-h-[500px] max-h-[85vh]`}
        >
          {/* Window Chrome Header */}
          <div className="h-9 px-4 bg-black/40 border-b border-inherit flex items-center justify-between select-none shrink-0">
            <div className="flex items-center gap-2">
              <span className="w-3 h-3 rounded-full bg-rose-500/80 inline-block"></span>
              <span className="w-3 h-3 rounded-full bg-amber-500/80 inline-block"></span>
              <span className="w-3 h-3 rounded-full bg-emerald-500/80 inline-block"></span>
            </div>
            <div className="flex items-center gap-1.5 text-xs text-slate-500 font-medium">
              <TerminalIcon className="w-3.5 h-3.5" />
              <span>wyntab — zsh</span>
            </div>
            <div className="text-[11px] text-slate-600 uppercase font-mono">
              {themeKey}
            </div>
          </div>

          {/* Terminal Console Output */}
          <div className="flex-1 p-5 overflow-y-auto space-y-2 select-text">
            {history.map((item, idx) => (
              <div key={idx} className="leading-relaxed">
                {item.type === 'command' ? (
                  <div className="flex items-center gap-2">
                    <span className={`${currentTheme.prompt} font-semibold`}>visitor@wyntab:~$</span>
                    <span className="text-white font-medium">{item.text}</span>
                  </div>
                ) : (
                  <div className={`whitespace-pre-wrap ${currentTheme.text} opacity-90 pl-0 sm:pl-2`}>
                    {item.text}
                  </div>
                )}
              </div>
            ))}

            {/* Current Input Row */}
            <div className="flex items-center gap-2 pt-1">
              <span className={`${currentTheme.prompt} font-semibold shrink-0`}>visitor@wyntab:~$</span>
              <input
                ref={inputRef}
                type="text"
                autoFocus
                value={inputVal}
                onChange={(e) => setInputVal(e.target.value)}
                onKeyDown={handleKeyDown}
                className="flex-1 bg-transparent text-white outline-none border-none p-0 focus:ring-0"
              />
            </div>
            <div ref={bottomRef} />
          </div>
        </div>
      )
    }

    createRoot(document.getElementById('root')).render(<TerminalApp />)
  </script>
</body>
</html>
